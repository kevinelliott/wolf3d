name: Release

# Build the Rust port for every supported platform and publish the
# binaries to a GitHub Release whenever a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# `workflow_dispatch` runs the same build matrix without publishing, so
# the packaging can be exercised on demand before cutting a real tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Version label to stamp artifacts with (e.g. v0.1.0-test)"
        required: false
        default: "dev"

permissions:
  contents: write

env:
  BIN_NAME: wolf3d-rs
  CARGO_TERM_COLOR: always
  # The cargo project lives in the rust/ subdirectory.
  PROJECT_DIR: rust

defaults:
  run:
    working-directory: rust

jobs:
  # ---------------------------------------------------------------------------
  # Native desktop builds (Linux, macOS, Windows).
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - label: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # macroquad links against X11/GL/ALSA on Linux; the dev headers must
      # be present at build time. (Native arm runner uses the same packages.)
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Resolve version label
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${DISPATCH_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          stage="wolf3d-rs-${VERSION}-${LABEL}"
          mkdir -p "dist/${stage}"
          bin="target/${TARGET}/release/${BIN_NAME}"

          case "${{ runner.os }}" in
            Windows)
              cp "${bin}.exe" "dist/${stage}/"
              cp README.md "dist/${stage}/"
              cp -r assets "dist/${stage}/"
              ( cd dist && 7z a -bd "${stage}.zip" "${stage}" >/dev/null )
              echo "asset=rust/dist/${stage}.zip" >> "$GITHUB_OUTPUT"
              ;;
            macOS)
              # Ship a double-clickable .app bundle.
              app="dist/${stage}/Wolfenstein 3D.app"
              mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
              cp "${bin}" "${app}/Contents/MacOS/${BIN_NAME}"
              cp -r assets "${app}/Contents/Resources/"
              cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Wolfenstein 3D</string>
            <key>CFBundleDisplayName</key><string>Wolfenstein 3D</string>
            <key>CFBundleIdentifier</key><string>com.kevinelliott.wolf3d-rs</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>${BIN_NAME}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
              cp README.md "dist/${stage}/"
              ( cd dist && tar -czf "${stage}.tar.gz" "${stage}" )
              echo "asset=rust/dist/${stage}.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cp "${bin}" "dist/${stage}/"
              cp README.md "dist/${stage}/"
              cp -r assets "dist/${stage}/"
              ( cd dist && tar -czf "${stage}.tar.gz" "${stage}" )
              echo "asset=rust/dist/${stage}.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Web (WebAssembly) build.
  # ---------------------------------------------------------------------------
  web:
    name: web-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: wasm32

      - name: Build wasm
        run: cargo build --release --locked --target wasm32-unknown-unknown

      - name: Resolve version label
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${DISPATCH_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package web bundle
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          stage="wolf3d-rs-${VERSION}-web"
          mkdir -p "dist/${stage}"
          cp "target/wasm32-unknown-unknown/release/${BIN_NAME}.wasm" "dist/${stage}/"
          cp web/index.html web/mq_js_bundle.js "dist/${stage}/"
          ( cd dist && tar -czf "${stage}.tar.gz" "${stage}" )
          echo "asset=rust/dist/${stage}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: gather every artifact and attach it to the GitHub Release.
  # Only runs for real tag pushes, not manual dispatch dry-runs.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build, web]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags containing a hyphen (e.g. v0.1.0-rc1) are treated as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
