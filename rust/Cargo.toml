[package]
name = "wolf3d-rs"
version = "0.1.0"
edition = "2021"
authors = ["Wolfenstein 3D Rust port contributors"]
description = "A modern Rust rewrite of Wolfenstein 3D"
license = "GPL-2.0-or-later"
repository = "https://github.com/kevinelliott/wolf3d"
readme = "README.md"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[[bin]]
name = "wolf3d-rs"
path = "src/main.rs"
